[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "da-plus"
version = "0.1.0"
description = "Per-user resource limits for DirectAdmin, built on systemd cgroups v2"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6",
    "textual>=8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
da-plus = "da_plus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
